<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORMA – Antrenamente / Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08080a;--card:#111115;--c2:#18181d;--line:#26262e;--txt:#f5f3ef;--mut:#9a98a3;--red:#e5284f;--pink:#ff8aa3;--gold:#d8b46a;--a1:#ff4d6d;--a2:#b3123a;--p1:#16161b;--p2:#0e0e12;--navbg:#101014f2;--sh:#000a;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.logo{font:italic 800 30px var(--disp);letter-spacing:.08em}.logo b{color:var(--gold)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.dt{display:none;color:var(--mut);text-transform:capitalize}
.lang{display:flex;background:var(--c2);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font-weight:700;font-size:12px;padding:7px 14px;border-radius:99px}
.lang .on{background:var(--red);color:#fff}
.nav{position:fixed;z-index:12;left:0;right:0;bottom:0;display:flex;background:var(--navbg);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .logo{display:none;padding:14px 14px 22px}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;border-radius:14px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--pink)}
.main{padding:16px 16px 96px;max-width:620px;margin:auto}
.pane{display:none;position:relative;overflow:hidden;background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--red) 8%,transparent),transparent 60%),linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:28px;padding:22px 18px;box-shadow:0 1px 0 #ffffff0d inset,0 24px 60px var(--sh)}
.pane::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 60%,transparent),transparent)}
.pane.act{display:block}
.pane>h2{font:italic 800 34px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0 0 20px}
.pane>h2::after{content:"";display:block;width:40px;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--gold),transparent)}
@media(min-width:900px){
 .nav{top:0;right:auto;bottom:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:12px;border-top:0;border-right:1px solid var(--line)}
 .nav .logo{display:block}.bar .logo{display:none}.dt{display:block}
 .nav button{grid-auto-flow:column;justify-content:start;align-items:center;gap:12px;font-size:14px;padding:12px 14px}
 .nav .on{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 15%,transparent),transparent);box-shadow:inset 2px 0 0 var(--red)}
 .bar,.main{margin-left:200px}
 .main{max-width:none;padding:24px 28px 40px}
 .panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;margin:auto;align-items:start}
 .pane{display:block}
}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--c2);color:var(--mut);font-weight:600;font-size:12px}
.tabs .on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--red) 33%,transparent)}
.ph{display:flex;justify-content:space-between;align-items:baseline;background:linear-gradient(135deg,color-mix(in srgb,var(--red) 24%,var(--card)),var(--card) 75%);border:1px solid color-mix(in srgb,var(--red) 20%,transparent);border-radius:20px;padding:16px 18px}
.ph h3{font:italic 800 28px var(--disp);margin:0;text-transform:uppercase}
.ph span{color:var(--mut);font-size:12px}
.pg{height:6px;background:var(--c2);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a1));box-shadow:0 0 10px var(--red);width:var(--w);transition:width .3s}
.wu{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.wu summary{cursor:pointer;font-weight:700;color:var(--gold)}
.wu ol{margin:8px 0 0;padding-left:18px;color:var(--mut)}
.wu li{padding:2px 0}.wu em{font-style:normal;color:var(--txt);float:right}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--c2),var(--card));border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;user-select:none}
.th{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--red) 20%,transparent),var(--bg));border:1px solid color-mix(in srgb,var(--red) 20%,transparent);display:grid;place-items:center;color:var(--pink);flex:none}
.th svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ex div{flex:1;min-width:0}.ex b{display:block;font-size:14px}.ex small{color:var(--mut)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #4a4a55;flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.ex.done .ck{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--red) 53%,transparent)}
.ex.done .ck::after{content:"✓"}
.ex.done b{text-decoration:line-through;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:14px 0 0}
.rest{text-align:center;padding:48px 8px}
.rest b{font:italic 800 40px var(--disp);color:var(--pink);text-transform:uppercase}
.rest p{color:var(--mut)}
.nums{display:flex;justify-content:space-around;text-align:center;margin-bottom:10px}
.nums b{display:block;font-weight:800;font-size:34px}
.nums span{font-size:12px;color:var(--mut)}
.map{width:100%;max-width:460px;height:auto;display:block;margin:auto;background:radial-gradient(#f4f6fa,#d5dbe6);border-radius:22px;padding:8px}
.bd{fill:#101015;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.m{fill:#2e2e38;stroke:#fff;stroke-width:1.1;stroke-linejoin:round;opacity:.6}
.m.on,.m.f{opacity:1}.m.on{fill:url(#gr);stroke-width:1.7;filter:drop-shadow(0 0 6px #ffffff99)}
.ln{fill:none;stroke:#ffffff66;stroke-width:.8;stroke-linecap:round}
.lbl{display:flex;justify-content:space-around;color:var(--mut);font-size:12px;max-width:460px;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.chip{background:color-mix(in srgb,var(--red) 8%,transparent);border:1px solid color-mix(in srgb,var(--red) 33%,transparent);color:var(--pink);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600}
.ring{width:150px;height:150px;border-radius:50%;margin:4px auto 10px;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--c2) 0);display:grid;place-items:center;box-shadow:0 0 44px color-mix(in srgb,var(--rc) 35%,transparent)}
.ring>div{width:124px;height:124px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring b{font:italic 800 24px/1.05 var(--disp);text-transform:uppercase;padding:0 6px}.ring span{color:var(--mut);font-size:12px}
.nx{text-align:center;color:var(--mut);font-size:13px;margin:0 0 16px}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rk li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--c2);border:1px solid var(--line);opacity:.45;font-weight:600;font-size:14px}
.rk li.got{opacity:1}
.rk i{width:14px;height:14px;border-radius:50%}
.rk em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:auto}
.tile{aspect-ratio:3/4;border:1px solid color-mix(in srgb,var(--gold) 33%,transparent);border-radius:26px;display:grid;place-content:center;justify-items:center;gap:6px;background:radial-gradient(circle at 30% 18%,color-mix(in srgb,var(--red) 20%,transparent),transparent 60%),linear-gradient(160deg,var(--p1),var(--p2));box-shadow:0 1px 0 #ffffff12 inset}
.tile b{font:italic 800 110px/1 var(--disp);background:linear-gradient(180deg,#ffe3a3,var(--gold) 55%,#8a6a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{font-size:12px;color:var(--gold);background:var(--bg);border:1px solid color-mix(in srgb,var(--gold) 27%,transparent);padding:4px 12px;border-radius:99px}
.bgn{color:var(--mut);text-align:center;font-size:13px;margin:18px 4px 0}
button.tile{padding:0;font:inherit;color:inherit;cursor:pointer}
.gb{background:var(--c2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.gtop{display:flex;justify-content:space-between;margin-bottom:14px}
#gView .ex b{font-weight:600;line-height:1.35}
.pin{position:fixed;inset:0;z-index:30;background:#000c;backdrop-filter:blur(14px);display:grid;place-items:center;padding:20px}
.pin[hidden]{display:none}
.pinbox{width:100%;max-width:320px;text-align:center;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid color-mix(in srgb,var(--gold) 33%,transparent);border-radius:28px;padding:28px 22px;box-shadow:0 30px 80px #000}
.pinbox>b{font:italic 800 28px var(--disp);text-transform:uppercase;letter-spacing:.04em}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #5a5a66}
.dots i.f{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 53%,transparent)}
.pe{height:18px;margin:4px 0 10px;color:var(--pink);font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pad button{height:56px;border-radius:18px;border:1px solid var(--line);background:var(--c2);color:var(--txt);font-size:22px;font-weight:600}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.in{width:100%;background:var(--c2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font:inherit}
.in:focus{outline:none;border-color:var(--gold)}
.lr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.lr b{font-size:14px}
.lh{color:var(--mut);font-size:12px;margin:0 0 12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.cta{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px color-mix(in srgb,var(--red) 33%,transparent)}
.lb{color:var(--mut);font-size:13px;margin:18px 0 8px}
.pick{justify-content:flex-start;margin-top:0}
.chip{font-family:inherit}
button.chip{cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.map.mini{max-width:280px;margin:14px auto 0}
.del{border:0;background:none;color:var(--mut);font-size:16px;padding:4px 8px}
#myL{margin-top:14px}
#myC{margin-top:14px}
.lv{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px}
.lv li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--c2);border:1px solid var(--line);font-size:14px}
.lv b{flex:1}.lv span{color:var(--gold);font-weight:700}.lv em{font-style:normal;color:var(--mut);font-size:12px}
.rk div{flex:1;min-width:0}.rk small{display:block;color:var(--mut);font-size:11px;font-weight:400}
.lg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.lg span{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}
.lv em{max-width:48%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv svg{flex:none}
.sx{flex:1}.sx.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.rcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,var(--bg)),var(--bg) 85%);opacity:.5}
.rc.got{opacity:1}
.rc.cur{box-shadow:0 0 0 2px var(--c),0 0 24px color-mix(in srgb,var(--c) 40%,transparent)}
.rc svg{flex:none}
.rc b{display:block;font:italic 800 19px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.rc small{display:block;color:var(--mut);font-size:11px;line-height:1.35}
.ring>div{justify-items:center;gap:1px}
.bimg{display:inline-grid;width:var(--z);height:var(--z);flex:none}
.bimg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--c,#fff) 45%,transparent))}
.bimg svg{width:100%;height:100%;display:none}
.bimg.err svg{display:block}.bimg.err img{display:none}
.er{list-style:none;position:relative;display:grid;gap:8px;background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:10px}
.er>.in{padding-right:44px}
.er .del{position:absolute;top:12px;right:8px;font-size:18px}
.gtop{gap:8px}.gtop .gb:first-child{margin-right:auto}
.hero{display:grid;justify-items:center;gap:6px;text-align:center;margin:4px 0 14px}
.hero>b{font:italic 800 38px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--c);text-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}
.hero.dim .bimg{opacity:.4;filter:grayscale(1)}
.lvl{font-weight:800;font-size:15px;letter-spacing:.14em}
.xpb{width:100%;height:12px;border-radius:99px;background:var(--c2);border:1px solid var(--line);overflow:hidden}
.xpb i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),var(--c));box-shadow:0 0 12px var(--c);transition:width .4s}
.xpt{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--mut)}
.hero .cta{margin-top:10px}
.rc{flex-direction:column;text-align:center;padding:16px 8px;gap:6px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}
.sv span{font-size:12px}.sv .warn{color:var(--pink)}.sv .ok{color:#34d399}.sv .cta{width:auto;padding:12px 20px}
#mBody .exs{margin-top:14px}
.rt{display:flex;align-items:center;gap:10px}
.uchip{display:flex;align-items:center;gap:8px;background:var(--c2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px}
.uchip:empty{display:none}
.avs,.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:800;font-size:13px;flex:none}
.av{width:54px;height:54px;font-size:24px}
.un{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.un{display:none}.uchip{padding:4px}}
.authbox,.wbox{text-align:left}
.authbox{max-width:360px;max-height:94vh;overflow:auto}
.authbox .logo{text-align:center;font-size:40px}
.authbox .nx{margin:6px 0 0}.authbox .tabs{margin:16px 0 12px}
.authbox .in{margin-bottom:8px}
.authbox .lang{width:max-content;margin:16px auto 0}
.rm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:6px 0 0}
.fine{color:var(--mut);font-size:11px;text-align:center;margin:12px 0 0}
.wbox{max-width:380px;max-height:92vh;overflow:auto}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wh small{display:block;color:var(--mut);font-size:13px}
.wh b{font:italic 800 28px/1 var(--disp);text-transform:uppercase;letter-spacing:.04em;font-style:italic}
.wbox h3{font:italic 800 26px var(--disp);text-transform:uppercase;margin:2px 0 0}
.wl{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.wl li{display:flex;justify-content:space-between;gap:10px;background:var(--c2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.wl span{color:var(--mut);white-space:nowrap}
.rkm{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--mut);font-size:13px}.rkm b{color:var(--txt)}
.wbox .chips{justify-content:flex-start;margin-top:8px}
#acctB .gb,#acctB .cta{width:100%;margin-top:8px;border-radius:14px}
#acctB textarea{margin-top:8px;font-size:12px}
.xi{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xi small{color:var(--mut);font-size:11px;flex:1;min-width:130px}
.xi .gb{padding:4px 12px}
.lib li{cursor:pointer}.lib li>div{display:grid;gap:2px}.lib li small{color:var(--mut);font-size:11px}
.lt{font:italic 800 24px var(--disp);text-transform:uppercase;letter-spacing:.03em}
.spark{width:100%;height:56px;margin:8px 0}
.xt{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.xt td,.xt th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:600}
.xt th:first-child,.xt td:first-child{text-align:left}
.lv b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .del{border:0;background:none;color:var(--mut);padding:0 0 0 10px}
@media (prefers-reduced-motion:no-preference){.m,.ck{transition:fill .25s,background .2s}.pane.act{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}}}

.bll{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.bl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--c2);border:1px solid var(--line);cursor:pointer}
.bl.me{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.bl .pos{width:26px;text-align:center;font:italic 800 22px var(--disp);color:var(--mut)}
.bl.top1 .pos{color:#ffc83d}.bl.top2 .pos{color:#b8c2d6}.bl.top3 .pos{color:#d8915a}
.bn{flex:1;min-width:0}.bn b{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bn small{color:var(--mut);font-size:11px}
.xp{font-weight:800;font-size:12px;color:var(--mut);white-space:nowrap}
.admb{display:inline-block;background:linear-gradient(135deg,#ffe08a,#c9971c);color:#1a1405;font-style:normal;font-weight:800;font-size:9px;letter-spacing:.12em;padding:2px 7px;border-radius:99px;flex:none}
.admbox{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,#ffc83d 12%,transparent);border:1px solid color-mix(in srgb,#ffc83d 40%,transparent);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13px}
.avs{overflow:hidden}.avs img{width:100%;height:100%;object-fit:cover;display:block}

function profOf(l){
  const bw=l.bw>=30?l.bw:80,a=l.age>=14?l.age:25;

function score(v,T){if(v<T[0])return v/T[0];let k=0;while(k<5&&v>=T[k+1])k++;return k>=5?6+Math.min(.999,(v-T[5])/(T[5]*.5)):k+1+(v-T[k])/(T[k+1]-T[k])}
function exScore(e,P){
  const c=findEx(e);if(!c)return null;
  if(e.raw||e.u||!(e.s>0&&e.r>0&&e.w>0))return {c,s:null};
  const load=c[4]==="bw"?P.bw+e.w:e.w,rm=e.r>1?load*(1+Math.min(e.r,12)/30):load;   /* Epley 1RM */
  return {c,rm,s:score(rm/P.bw/c[5],TH(c[3]).map(y=>y*P.sc))};

    const k=r.c[3],a=acc[k]||(acc[k]={sum:0,sets:0,n:0,best:0});
    a.sum+=r.s*e.s;a.sets+=e.s;a.n++;if(r.s>a.best)a.best=r.s;

  Object.keys(acc).forEach(k=>{const a=acc[k];out.RS[k]={s:.6*a.sum/a.sets+.4*a.best,n:a.n,sets:a.sets}});

}

async function doAuth(){
  if(amode==="pan"){
    const code=$("#aC").value.trim().toUpperCase();
    if(!code)return authErr("nc");
    const h=await hash("zee|"+code);
    if(h!==ADMIN_H&&h!==ADMIN_F)return authErr("badc");
    const old=USERS.zee||{};
    USERS.zee=Object.assign({},old,{name:old.name||"Zee",h,t:old.t||Date.now(),admin:true,owner:true});saveUsers();
    $("#aC").value="";$("#aE").textContent="";

  }
  const n=$("#aN").value.trim(),pw=$("#aP").value,id=n.toLowerCase();
  if(!n)return authErr("nn");
  if(pw.length<4)return authErr("short");
  const h=await hash(id+"|"+pw);
  if(id==="zee"){
    const hz=await hash("zee|"+pw.trim());
    if(hz!==ADMIN_H&&hz!==ADMIN_F)return authErr(amode==="new"?"taken":"bad");
    const old=USERS.zee||{};
    USERS.zee=Object.assign({},old,{name:old.name||"Zee",h:hz,t:old.t||Date.now(),admin:true,owner:true});saveUsers();
  }else if(amode==="new"){
    if(USERS[id])return authErr("taken");
    USERS[id]={name:n,h,t:Date.now()};saveUsers();
    try{if(!localStorage.getItem("mig")){["pr","lf","mp"].forEach(k=>{const v=localStorage.getItem(k);if(v!=null)localStorage.setItem("u:"+id+":"+k,v)});localStorage.setItem("mig","1")}}catch(x){}
  }else if(!USERS[id]||USERS[id].h!==h)return authErr("bad");
  $("#aP").value="";$("#aE").textContent="";
  enter(id,$("#aR").checked);
}

function applyTheme(k){
  const T=THEMES[k]||THEMES.crimson,r=document.documentElement.style;
  Object.keys(T).forEach(n=>{if(n[0]==="-")r.setProperty(n,T[n])});
  r.colorScheme=T.light?"light":"dark";
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",T["--bg"]);
  try{localStorage.setItem("theme",THEMES[k]?k:"crimson")}catch(x){}
}

/* social links */
const SOC=[["ig","Instagram","https://instagram.com/"],["tt","TikTok","https://tiktok.com/@"],["yt","YouTube","https://youtube.com/@"],["x","X","https://x.com/"],["fb","Facebook","https://facebook.com/"],["dc","Discord",""],["web","Website",""]];
function socUrl(k,v){
  v=(v||"").trim();if(!v)return "";
  if(/^https?:\/\//i.test(v))return v;
  const b=SOC.find(x=>x[0]===k)[2];
  if(!b)return k==="web"&&/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)?"https://"+v:"";
  return b+encodeURIComponent(v.replace(/^@/,""));
}
const socHTML=u=>SOC.map(x=>{const v=String(((u&&u.soc)||{})[x[0]]||"").slice(0,80);if(!v)return "";const url=socUrl(x[0],v);return url?`<a class="soc" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${x[1]}</a>`:`<span class="soc">${x[1]}: ${esc(v)}</span>`}).join("");

/* leaderboard: accounts on this device + online (shared database of the published page) */
let bcat="all",bmode="onl",DB=null,UIDS=null,ONL=[],onlOK=false,onlErr="",canW=null,UOWN=false,lastPush="",pt=0;
function board(cat){
  return Object.keys(USERS).map(id=>{
    let m0=null,l0=null;
    try{m0=JSON.parse(localStorage.getItem("u:"+id+":mp")||"null");l0=JSON.parse(localStorage.getItem("u:"+id+":lf")||"null")}catch(x){}
    if(id===uid){m0=my;l0=lf}
    const o=rankData(m0,l0),ks=Object.keys(o.RS);
    const mean=ks.length?ks.reduce((a,k)=>a+o.RS[k].s,0)/ks.length:0;
    const has=cat==="all"?ks.length>0:!!o.RS[cat];
    return {id,sc:cat==="all"?mean:(o.RS[cat]?o.RS[cat].s:0),has};
  }).sort((a,b)=>b.sc-a.sc);
}
function onlRows(cat){
  return ONL.map(d=>{const s=d.s&&typeof d.s==="object"?d.s:{},sc=cat==="all"?(+d.sc||0):(+s[cat]||0);return {d,sc,has:sc>0}}).sort((a,b)=>b.sc-a.sc);
}
function schedPush(){clearTimeout(pt);pt=setTimeout(pushScore,1500)}
async function pushScore(){
  if(!DB||!UIDS||!uid||!USERS[uid]||!USERS[uid].pub||canW===false)return;
  const u=USERS[uid],o=rankData(my,lf),ks=Object.keys(o.RS),s={};
  const mean=ks.length?ks.reduce((a,k)=>a+o.RS[k].s,0)/ks.length:0;
  ks.forEach(k=>{s[k]=Math.round(o.RS[k].s*1000)/1000});
  const doc={n:String(u.name).slice(0,24),bio:String(u.bio||"").slice(0,140),soc:u.soc||{},sc:Math.round(mean*1000)/1000,s,t:Date.now()};
  if(typeof u.av==="string"&&u.av.length<40000)doc.av=u.av;
  const key=JSON.stringify(Object.assign({},doc,{t:0}));
  if(key===lastPush)return;
  try{await DB.doc("lb/"+UIDS).set(doc);lastPush=key;onlErr=""}catch(e){onlErr=(e&&e.code)||"error"}
  renderBoard();
}
async function pullScore(){if(!DB||!UIDS)return;try{await DB.doc("lb/"+UIDS).delete();lastPush=""}catch(e){}}
(async()=>{
  try{
    if(!(window.claude&&claude.use))return;
    const [db,us]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!us)return;
    DB=db;UIDS=await us.id();UOWN=await us.isOwner();canW=await us.can("data.write");
    const tm=setTimeout(()=>{onlErr="timeout";renderBoard()},10000);
    DB.collection("lb").onSnapshot(snap=>{clearTimeout(tm);ONL=snap.docs.map(d=>Object.assign({id:d.id},d.data()));onlOK=true;renderBoard()},e=>{clearTimeout(tm);onlErr=(e&&e.code)||"error";onlOK=false;renderBoard()});
    renderBoard();
  }catch(e){}
})();

  }else{
    rows=board(bcat).map((r,i)=>{
      const lu=USERS[r.id],ri=Math.min(6,Math.floor(r.sc)),c=RK[ri];
      return `<li class="bl${r.id===uid?" me":""}${i<3&&r.has?" top"+(i+1):""}" data-u="${r.id}"><span class="pos">${i+1}</span>${avt(r.id,40)}<div class="bn"><b>${esc(lu.name)}${roleB(lu)}</b><small>${r.has?c[0]+" · LVL "+Math.min(70,Math.floor(r.sc*10)+1):t("norank")}</small></div>${r.has?bimg(c,ri,40):""}<span class="xp">${r.has?Math.round(r.sc*1000)+" XP":"–"}</span></li>`});

  <p class="fine" style="text-align:left;margin:0 0 10px">${t("libnote")}</p>
  <input class="in" id="libQ" placeholder="${t("search")}" value="${esc(libF.q)}">
  <div class="chips pick" style="margin:10px 0"><button class="chip${libF.m?"":" on"}" data-m="">${t("all")}</button>${Object.keys(M).map(k=>`<button class="chip${libF.m===k?" on":""}" data-m="${k}">${li(M[k])}</button>`).join("")}</div>
  <ul class="wl lib" id="libL"></ul>`;
  libList();
}
function openLib(){libF={q:"",m:""};renderLib();$("#lib").hidden=false}
$("#lib").addEventListener("click",e=>{
  if(e.target.id==="lib"){$("#lib").hidden=true;return}
  const b=e.target.closest("button"),l=e.target.closest("[data-id]");
  if(b&&b.dataset.a==="x")$("#lib").hidden=true;
  else if(b&&b.dataset.m!==undefined){libF.m=b.dataset.m;renderLib()}
  else if(l){const x=LIB.find(v=>v[0]===l.dataset.id),dd=my.days[msel];dd.e.push({id:x[0],n:x[1],n2:x[2],s:3,r:10,w:0});if(!dd.m.includes(x[3]))dd.m.push(x[3]);sm();$("#lib").hidden=true;render()}
});
$("#lib").addEventListener("input",e=>{if(e.target.id==="libQ"){libF.q=e.target.value;libList()}});

const xkey=e=>e.id||(e.n||"").trim().toLowerCase();
function spark(v){
  if(v.length<2)return "";
  const mx=Math.max(...v),mn=Math.min(...v),W=280,H=56;
  const pts=v.map((y,i)=>(i/(v.length-1)*W).toFixed(1)+","+(mx===mn?H/2:H-4-(y-mn)/(mx-mn)*(H-8)).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none"><polyline points="${pts}" fill="none" style="stroke:var(--a1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderX(){
  const e=my.days[msel].e[xi];if(!e){$("#xd").hidden=true;return}
  const P=prof(),r=exScore(e,P),c=r&&r.c,H=my.log[xkey(e)]||[];
  let h=`<div class="gtop"><b class="lt">${esc(nm(e))}</b><button class="gb" data-a="x">✕</button></div>`;
  if(!c){$("#xdB").innerHTML=h+`<p class="nx" style="text-align:left">${t("unk")}</p>`;return}
  const k=r.s==null?null:Math.min(6,Math.floor(r.s)),T=TH(c[3]).map(y=>y*P.sc*P.bw*c[5]);
  h+=`<div class="chips" style="justify-content:flex-start;margin:0"><span class="chip">${li(M[c[3]])}</span><span class="chip">${MODE[c[4]][lang==="ro"?0:1]}</span></div>
  <p class="nx" style="text-align:left;margin:10px 0">${t("cmp")}: <b>${Math.round(c[5]*100)}%</b> ${li(RL[c[3]])}</p>`;
  h+=k!=null?`<div class="rkm">${bimg(RK[k],k,64)}<div><b style="color:${RK[k][2]}">${RK[k][0]}</b><br>LVL ${Math.min(70,Math.floor(r.s*10)+1)} · 1RM ${Math.round(r.rm*10)/10} kg</div></div>`:`<p class="nx" style="text-align:left">${t("noest")}</p>`;
  const f=v=>c[4]==="bw"?(v-P.bw<=0?"0":"+"+Math.round(v-P.bw)):Math.round(v);
  h+=`<table class="xt"><tr><th>${t("n3")}</th><th>1RM</th><th>8 ${t("reps")}</th></tr>${RK.map((q,i)=>{const n1=T[i?i-1:0],n8=n1/(1+8/30),p=i?"":"< ";return `<tr${i===k?` style="color:${q[2]}"`:""}><td>${q[0]}</td><td>${p}${f(n1)} kg</td><td>${p}${f(n8)} kg</td></tr>`}).join("")}</table>`;
  h+=`<p class="lb">${t("logT")}</p><div class="row3"><input class="in" id="xW" type="number" inputmode="decimal" placeholder="kg" value="${e.w||""}"><input class="in" id="xR" type="number" inputmode="numeric" placeholder="${t("reps")}" value="${e.r||""}"><button class="cta" data-a="log" style="padding:0">${t("logAdd")}</button></div>`;
  h+=spark(H.map(z=>z.r>1?z.w*(1+Math.min(z.r,12)/30):z.w))+`<ul class="wl">${H.slice(-8).reverse().map((z,j)=>`<li><b>${new Date(z.t).toLocaleDateString(lang==="ro"?"ro-RO":"en-GB",{day:"numeric",month:"short"})}</b><span>${z.w} kg × ${z.r}<button class="del" data-del="${H.length-1-j}" aria-label="Delete">✕</button></span></li>`).join("")}</ul>`;
  $("#xdB").innerHTML=h;
}
function openX(i){xi=i;renderX();$("#xd").hidden=false}
$("#xd").addEventListener("click",e=>{
  if(e.target.id==="xd"){$("#xd").hidden=true;return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.a==="x")$("#xd").hidden=true;
  else if(b.dataset.a==="log"){
    const o=my.days[msel].e[xi],w=+$("#xW").value||0,r=+$("#xR").value||0;if(!(w>0&&r>0))return;
    const k=xkey(o);(my.log[k]=my.log[k]||[]).push({t:Date.now(),w,r});
    o.w=w;o.r=r;if(!(o.s>0))o.s=1;delete o.raw;
    my.sv=JSON.stringify({t:Date.now(),n:my.n,days:my.days});sm();render();renderX();
  }else if(b.dataset.del!==undefined){my.log[xkey(my.days[msel].e[xi])].splice(+b.dataset.del,1);sm();renderX()}
});

const wide=matchMedia("(min-width:900px)");
function go(p,scroll){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  document.querySelectorAll(".pane").forEach(s=>s.classList.toggle("act",s.id==="p-"+p));
  if(scroll){wide.matches?$("#p-"+p).scrollIntoView({behavior:"smooth",block:"start"}):scrollTo(0,0)}
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.p,true)});
document.querySelectorAll(".lang").forEach(l=>l.addEventListener("click",e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;save("l",lang);render()}}));
try{USERS=JSON.parse(localStorage.getItem("users")||"{}")}catch(x){}
try{applyTheme(localStorage.getItem("theme"))}catch(x){}
let sid=null;try{sid=localStorage.getItem("sess")||sessionStorage.getItem("sess")}catch(x){}
if(sid&&USERS[sid]){uid=sid;loadUser();unlocked=isAdm();$("#auth").hidden=true;render();showWelcome();schedPush()}else{$("#auth").hidden=false;render()}
loadBody();
</script>
</body>
