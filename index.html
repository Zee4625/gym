<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORMA – Antrenamente / Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08080a;--card:#111115;--c2:#18181d;--line:#26262e;--txt:#f5f3ef;--mut:#9a98a3;--red:#e5284f;--pink:#ff8aa3;--gold:#d8b46a;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.logo{font:italic 800 30px var(--disp);letter-spacing:.08em}.logo b{color:var(--gold)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.dt{display:none;color:var(--mut);text-transform:capitalize}
.lang{display:flex;background:var(--c2);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font-weight:700;font-size:12px;padding:7px 14px;border-radius:99px}
.lang .on{background:var(--red);color:#fff}
.nav{position:fixed;z-index:12;left:0;right:0;bottom:0;display:flex;background:#101014f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .logo{display:none;padding:14px 14px 22px}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;border-radius:14px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--pink)}
.main{padding:16px 16px 96px;max-width:620px;margin:auto}
.pane{display:none;position:relative;overflow:hidden;background:radial-gradient(120% 60% at 50% -10%,#e5284f14,transparent 60%),linear-gradient(180deg,#16161b,#0e0e12);border:1px solid var(--line);border-radius:28px;padding:22px 18px;box-shadow:0 1px 0 #ffffff0d inset,0 24px 60px #000a}
.pane::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#d8b46a99,transparent)}
.pane.act{display:block}
.pane>h2{font:italic 800 34px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0 0 20px}
.pane>h2::after{content:"";display:block;width:40px;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--gold),transparent)}
@media(min-width:900px){
 .nav{top:0;right:auto;bottom:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:12px;border-top:0;border-right:1px solid var(--line)}
 .nav .logo{display:block}.bar .logo{display:none}.dt{display:block}
 .nav button{grid-auto-flow:column;justify-content:start;align-items:center;gap:12px;font-size:14px;padding:12px 14px}
 .nav .on{background:linear-gradient(90deg,#e5284f26,transparent);box-shadow:inset 2px 0 0 var(--red)}
 .bar,.main{margin-left:200px}
 .main{max-width:none;padding:24px 28px 40px}
 .panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;margin:auto;align-items:start}
 .pane{display:block}
}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--c2);color:var(--mut);font-weight:600;font-size:12px}
.tabs .on{background:linear-gradient(135deg,#ff4d6d,#b3123a);border-color:transparent;color:#fff;box-shadow:0 8px 20px #e5284f55}
.ph{display:flex;justify-content:space-between;align-items:baseline;background:linear-gradient(135deg,#3d1020,#15151a 75%);border:1px solid #e5284f33;border-radius:20px;padding:16px 18px}
.ph h3{font:italic 800 28px var(--disp);margin:0;text-transform:uppercase}
.ph span{color:var(--mut);font-size:12px}
.pg{height:6px;background:var(--c2);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#b3123a,#ff5c7a);box-shadow:0 0 10px #e5284f;width:var(--w);transition:width .3s}
.wu{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.wu summary{cursor:pointer;font-weight:700;color:var(--gold)}
.wu ol{margin:8px 0 0;padding-left:18px;color:var(--mut)}
.wu li{padding:2px 0}.wu em{font-style:normal;color:var(--txt);float:right}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#1c1c22,#15151a);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;user-select:none}
.th{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 30% 25%,#e5284f33,#0c0c10);border:1px solid #e5284f33;display:grid;place-items:center;color:var(--pink);flex:none}
.th svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ex div{flex:1;min-width:0}.ex b{display:block;font-size:14px}.ex small{color:var(--mut)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #4a4a55;flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.ex.done .ck{background:linear-gradient(135deg,#ff4d6d,#b3123a);border-color:transparent;box-shadow:0 0 12px #e5284f88}
.ex.done .ck::after{content:"✓"}
.ex.done b{text-decoration:line-through;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:14px 0 0}
.rest{text-align:center;padding:48px 8px}
.rest b{font:italic 800 40px var(--disp);color:var(--pink);text-transform:uppercase}
.rest p{color:var(--mut)}
.nums{display:flex;justify-content:space-around;text-align:center;margin-bottom:10px}
.nums b{display:block;font-weight:800;font-size:34px}
.nums span{font-size:12px;color:var(--mut)}
svg.map{width:100%;max-width:460px;height:auto;display:block;margin:auto;background:radial-gradient(55% 50% at 50% 48%,#e5284f26,transparent 70%)}
.bd{fill:#101015;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.m{fill:#2e2e38;stroke:#fff;stroke-width:1.1;stroke-linejoin:round;opacity:.6}
.m.on,.m.f{opacity:1}.m.on{fill:url(#gr);stroke-width:1.7;filter:drop-shadow(0 0 6px #ffffff99)}
.ln{fill:none;stroke:#ffffff66;stroke-width:.8;stroke-linecap:round}
.lbl{display:flex;justify-content:space-around;color:var(--mut);font-size:12px;max-width:460px;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.chip{background:#e5284f14;border:1px solid #e5284f55;color:var(--pink);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600}
.ring{width:150px;height:150px;border-radius:50%;margin:4px auto 10px;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--c2) 0);display:grid;place-items:center;box-shadow:0 0 44px color-mix(in srgb,var(--rc) 35%,transparent)}
.ring>div{width:124px;height:124px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring b{font:italic 800 24px/1.05 var(--disp);text-transform:uppercase;padding:0 6px}.ring span{color:var(--mut);font-size:12px}
.nx{text-align:center;color:var(--mut);font-size:13px;margin:0 0 16px}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rk li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--c2);border:1px solid var(--line);opacity:.45;font-weight:600;font-size:14px}
.rk li.got{opacity:1}
.rk i{width:14px;height:14px;border-radius:50%}
.rk em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:auto}
.tile{aspect-ratio:3/4;border:1px solid #d8b46a55;border-radius:26px;display:grid;place-content:center;justify-items:center;gap:6px;background:radial-gradient(circle at 30% 18%,#e5284f33,transparent 60%),linear-gradient(160deg,#1b1b21,#0d0d11);box-shadow:0 1px 0 #ffffff12 inset}
.tile b{font:italic 800 110px/1 var(--disp);background:linear-gradient(180deg,#ffe3a3,#d8b46a 55%,#8a6a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{font-size:12px;color:var(--gold);background:#08080a;border:1px solid #d8b46a44;padding:4px 12px;border-radius:99px}
.bgn{color:var(--mut);text-align:center;font-size:13px;margin:18px 4px 0}
button.tile{padding:0;font:inherit;color:inherit;cursor:pointer}
.gb{background:var(--c2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.gtop{display:flex;justify-content:space-between;margin-bottom:14px}
#gView .ex b{font-weight:600;line-height:1.35}
.pin{position:fixed;inset:0;z-index:30;background:#000c;backdrop-filter:blur(14px);display:grid;place-items:center;padding:20px}
.pin[hidden]{display:none}
.pinbox{width:100%;max-width:320px;text-align:center;background:linear-gradient(180deg,#1a1a20,#0e0e12);border:1px solid #d8b46a55;border-radius:28px;padding:28px 22px;box-shadow:0 30px 80px #000}
.pinbox>b{font:italic 800 28px var(--disp);text-transform:uppercase;letter-spacing:.04em}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #5a5a66}
.dots i.f{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px #d8b46a88}
.pe{height:18px;margin:4px 0 10px;color:var(--pink);font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pad button{height:56px;border-radius:18px;border:1px solid var(--line);background:var(--c2);color:var(--txt);font-size:22px;font-weight:600}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.in{width:100%;background:var(--c2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font:inherit}
.in:focus{outline:none;border-color:var(--gold)}
.lr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.lr b{font-size:14px}
.lh{color:var(--mut);font-size:12px;margin:0 0 12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.cta{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff4d6d,#b3123a);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px #e5284f55}
.lb{color:var(--mut);font-size:13px;margin:18px 0 8px}
.pick{justify-content:flex-start;margin-top:0}
.chip{font-family:inherit}
button.chip{cursor:pointer}
.chip.on{background:linear-gradient(135deg,#ff4d6d,#b3123a);color:#fff;border-color:transparent}
svg.map.mini{max-width:280px;margin:14px auto 0}
.del{border:0;background:none;color:var(--mut);font-size:16px;padding:4px 8px}
#myL{margin-top:14px}
#myC{margin-top:14px}
.lv{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px}
.lv li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--c2);border:1px solid var(--line);font-size:14px}
.lv b{flex:1}.lv span{color:var(--gold);font-weight:700}.lv em{font-style:normal;color:var(--mut);font-size:12px}
.rk div{flex:1;min-width:0}.rk small{display:block;color:var(--mut);font-size:11px;font-weight:400}
.lg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.lg span{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}
.lv em{max-width:48%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv svg{flex:none}
.sx{flex:1}.sx.on{background:linear-gradient(135deg,#ff4d6d,#b3123a);border-color:transparent}
.rcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,#0c0c10),#0c0c10 85%);opacity:.5}
.rc.got{opacity:1}
.rc.cur{box-shadow:0 0 0 2px var(--c),0 0 24px color-mix(in srgb,var(--c) 40%,transparent)}
.rc svg{flex:none}
.rc b{display:block;font:italic 800 19px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.rc small{display:block;color:var(--mut);font-size:11px;line-height:1.35}
.ring>div{justify-items:center;gap:1px}
@media (prefers-reduced-motion:no-preference){.m,.ck{transition:fill .25s,background .2s}.pane.act{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c5368"/><stop offset="1" stop-color="#262a35"/></linearGradient><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d667e"/><stop offset="1" stop-color="#363b4a"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c7a"/><stop offset="1" stop-color="#b3123a"/></linearGradient></defs>
<symbol id="db" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></symbol>
<symbol id="bd" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 9v6M7 11l5-2 5 2M9 21l3-6 3 6"/></symbol>
<symbol id="tr" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/></symbol>

<header class="bar">
  <div class="logo">FORMA<b>.</b></div>
  <div class="dt" id="dt"></div>
  <div class="lang" role="group" aria-label="Limba / Language"><button data-l="ro">RO</button><button data-l="en">EN</button></div>
</header>

<nav class="nav" id="nav">
  <div class="logo">FORMA<b>.</b></div>
  <button data-p="plan" class="on"><svg><use href="#db"/></svg><span data-i="n1"></span></button>
  <button data-p="body"><svg><use href="#bd"/></svg><span data-i="n2"></span></button>
  <button data-p="rank"><svg><use href="#tr"/></svg><span data-i="n3"></span></button>
  <button data-p="bg"><svg><use href="#st"/></svg><span data-i="n4"></span></button>
  <button data-p="my"><svg><use href="#pl"/></svg><span data-i="n5"></span></button>
</nav>

<main class="main"><div class="panes">
  <section class="pane act" id="p-plan"><h2 data-i="h1"></h2><div class="tabs" id="tabs"></div><div id="plan"></div></section>
  <section class="pane" id="p-body"><h2 data-i="h2"></h2><div class="nums" id="nums"></div><svg class="map" id="map" viewBox="0 0 400 440" role="img" aria-label="Muscle map"></svg><div class="lbl"><span data-i="front"></span><span data-i="back"></span></div><div class="chips" id="chips"></div><div class="lg" id="lg"></div></section>
  <section class="pane" id="p-rank"><h2 data-i="h3"></h2><p class="lh" data-i="lh"></p><div id="lifts"><div class="lr"><b data-i="bw"></b><input class="in" id="bw" type="number" inputmode="decimal" min="30" max="250"><span></span></div><div class="lr"><b data-i="ag"></b><input class="in" id="ag" type="number" inputmode="numeric" min="14" max="90"><span></span></div><div class="lr"><b data-i="sx"></b><button class="gb sx" id="sxm" data-s="m" data-i="sm"></button><button class="gb sx" id="sxf" data-s="f" data-i="sf"></button></div></div><div id="rank"></div></section>
  <section class="pane" id="p-bg"><h2 data-i="h4"></h2><div id="bgHome"><div class="bg"><div class="tile"><b>B</b><span data-i="soon"></span></div><button class="tile" id="gTile" aria-label="G"><b>G</b><span id="gS"></span></button></div><p class="bgn" data-i="bgn"></p></div><div id="gView" hidden></div></section>
  <section class="pane" id="p-my"><h2 data-i="h5"></h2><input class="in" id="myN" maxlength="40" data-ph="wn"><p class="lb" data-i="pick"></p><div class="chips pick" id="myM"></div><svg class="map mini" id="myMap" viewBox="0 0 400 440" role="img" aria-label="Muscle map"></svg><p class="lb" data-i="exn"></p><input class="in" id="myE" maxlength="50" data-ph="exn"><div class="row3"><input class="in" id="myS" type="number" inputmode="numeric" min="0" data-ph="sets"><input class="in" id="myR" type="number" inputmode="numeric" min="0" data-ph="reps"><input class="in" id="myW" type="number" inputmode="decimal" min="0" data-ph="kg"></div><button class="cta" id="myA" data-i="add"></button><ul class="exs" id="myL"></ul><button class="gb" id="myC" data-i="clr"></button></section>
</div></main>
<div class="pin" id="pin" hidden><div class="pinbox"><b data-i="pinT"></b><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><p class="pe" id="pinE"></p><div class="pad" id="pad"></div><button class="gb" id="pinX" data-i="cancel"></button></div></div>

<script>

  Object.values(G).forEach(g=>g.e.forEach(x=>{
    if(/\b(sec|min)\b/i.test(x))return;
    const m=/^\s*(\d+)\s*x\s*(\d+)/.exec(x),k=/(\d+(?:[.,]\d+)?)\s*kg/i.exec(x);
    if(m&&k)items.push([x,+m[2],+k[1].replace(",","."),"G"]);
  }));
  my.e.forEach(e=>{if(e.w>0)items.push([e.n,e.r||1,e.w,"my"])});
  items.forEach(([x,reps,kg,src])=>{
    const c=CL.find(c=>c[0].test(x));if(!c)return;
    const load=c[2]==="bw"?P.bw+kg:kg,rm=reps>1?load*(1+Math.min(reps,12)/30):load;   /* Epley 1RM */
    const sc=score(rm/P.bw/c[3],TH(c[1]).map(y=>y*P.sc));
    if(!best[c[1]]||sc>best[c[1]].s)best[c[1]]={s:sc,x,src};
  });
  RS=best;RC={};
  Object.keys(best).forEach(k=>{RC[k]=RK[Math.min(7,Math.floor(best[k].s))][2]});
}
function renderRank(){
  const P=prof(),S=Object.keys(RS);
  $("#sxm").classList.toggle("on",lf.sex!=="f");$("#sxf").classList.toggle("on",lf.sex==="f");
  const m=S.length?S.reduce((a,k)=>a+RS[k].s,0)/S.length:0,ri=Math.min(7,Math.floor(m)),cur=RK[ri],p=ri>=7?100:Math.round((m-ri)*100);
  const legend=RK.map(r=>`<span style="color:${r[2]};border-color:${r[2]}66;background:${r[2]}1f">${li(r)}</span>`).join("");
  $("#lg").innerHTML=legend;
  const T=TH(rk).map(x=>x*P.sc*P.bw),fm=v=>Math.round(v*2)/2;
  let wk="";
  if(S.length>1){const ks=[...S].sort((a,b)=>RS[a].s-RS[b].s),lo=ks[0];if(RS[ks[ks.length-1]].s-RS[lo].s>=1)wk=`<p class="nx">${t("weak")}: <b style="color:${RK[Math.min(7,Math.floor(RS[lo].s))][2]}">${li(M[lo])}</b></p>`}
  $("#rank").innerHTML=`<div class="ring" style="--p:${p};--rc:${cur[2]}"><div>${S.length?badge(cur[2],ri,38)+`<b>${li(cur)}</b>`:"<b>–</b>"}<span>${t("ov")}</span></div></div>
  <p class="nx">${S.length?(ri<7?t("nxt")+" "+li(RK[ri+1]):t("max")):t("need")}</p>${wk}
  <p class="lb">${t("mr")}</p>
  <ul class="lv">${Object.keys(M).map(k=>{const r=RS[k],i=r?Math.min(7,Math.floor(r.s)):0,c=RK[i];return `<li>${r?badge(c[2],i,24):""}<b>${li(M[k])}</b><span style="color:${r?c[2]:"var(--mut)"}">${r?li(c):t("nd")}</span><em>${r&&(unlocked||r.src==="my")?esc(r.x.replace(/^\s*\d+\s*x\s*\d+\s*/,"")):""}</em></li>`}).join("")}</ul>
  <div class="lg">${legend}</div>
  <p class="lb">${t("rf")}: ${li(RL[rk])}</p>
  <div class="chips pick">${Object.keys(M).map(k=>`<button class="chip${k===rk?" on":""}" data-r="${k}">${li(M[k])}</button>`).join("")}</div>
  <div class="rcs" style="margin-top:14px">${RK.map((r,i)=>{const v=T[i?i-1:0];return `<div class="rc${S.length&&i<=ri?" got":""}${S.length&&i===ri?" cur":""}" style="--c:${r[2]}">${badge(r[2],i,46)}<div><b>${li(r)}</b><small>${i?"":"< "}${fm(v)} kg / ${Math.round(v*2.2046)} lb</small><small>${i===0?"< 5%":i===7?"Top 1%":t("beat")+" "+PC[i]+"%"}</small></div></div>`}).join("")}</div>`;
}
$("#bw").value=lf.bw||"";$("#ag").value=lf.age||"";
$("#lifts").addEventListener("input",()=>{lf.bw=+$("#bw").value||0;lf.age=+$("#ag").value||0;save("lf",JSON.stringify(lf));render()});
$("#lifts").addEventListener("click",e=>{const b=e.target.closest(".sx");if(b){lf.sex=b.dataset.s;save("lf",JSON.stringify(lf));render()}});
$("#rank").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.r){rk=b.dataset.r;renderRank()}});
const sv=()=>save("my",JSON.stringify(my));
function renderMy(){
  const on=new Set(my.m);
  $("#myM").innerHTML=Object.keys(M).map(k=>`<button data-k="${k}" class="chip${on.has(k)?" on":""}">${li(M[k])}</button>`).join("");
  $("#myMap").innerHTML=fig(FM,FL,on,0)+fig(BM,BL,on,200);
  $("#myL").innerHTML=my.e.length?my.e.map((e,i)=>`<li class="ex${e.d?" done":""}" data-x="${i}"><span class="th"><svg><use href="#db"/></svg></span><div><b>${esc(e.n)}</b><small>${e.s||"–"} × ${e.r||"–"}${e.w?", "+e.w+" kg":""}</small></div><button class="del" aria-label="Delete">✕</button><span class="ck"></span></li>`).join(""):`<li class="hint">${t("empty")}</li>`;
}
$("#myN").value=my.n||"";
$("#myN").addEventListener("input",e=>{my.n=e.target.value;sv()});
$("#myM").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;my.m=my.m.includes(k)?my.m.filter(x=>x!==k):[...my.m,k];sv();renderMy()});
$("#myA").addEventListener("click",()=>{const n=$("#myE").value.trim();if(!n)return;my.e.push({n,s:+$("#myS").value||0,r:+$("#myR").value||0,w:+$("#myW").value||0,d:false});["myE","myS","myR","myW"].forEach(i=>{$("#"+i).value=""});sv();renderMy()});
$("#myE").addEventListener("keydown",e=>{if(e.key==="Enter")$("#myA").click()});
$("#myL").addEventListener("click",e=>{const l=e.target.closest(".ex");if(!l)return;const i=+l.dataset.x;if(e.target.closest(".del"))my.e.splice(i,1);else my.e[i].d=!my.e[i].d;sv();renderMy()});
$("#myC").addEventListener("click",()=>{my={n:"",m:[],e:[]};$("#myN").value="";sv();renderMy()});
const wide=matchMedia("(min-width:900px)");
function go(p,scroll){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  document.querySelectorAll(".pane").forEach(s=>s.classList.toggle("act",s.id==="p-"+p));
  if(scroll){wide.matches?$("#p-"+p).scrollIntoView({behavior:"smooth",block:"start"}):scrollTo(0,0)}
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.p,true)});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){sel=+b.dataset.d;render()}});
$("#plan").addEventListener("click",e=>{const l=e.target.closest(".ex");if(l){const k=sel+"_"+l.dataset.x;done[k]=!done[k];save("d",JSON.stringify(done));render()}});
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;save("l",lang);render()}});
render();
</script>
